name: Refresh saved reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-reports.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: music-deals-refs/heads/main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Restore the latest full snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_snapshot.py
      - name: Select the saved run
        run: |
          python - <<'PY'
          import sqlite3,os
          from pathlib import Path
          assert Path('data/deals.sqlite').exists(), 'No prior snapshot is available; run Collect music promotions first'
          db=sqlite3.connect('file:data/deals.sqlite?mode=ro',uri=True)
          row=db.execute('SELECT id FROM runs ORDER BY started_at DESC LIMIT 1').fetchone()
          assert row, 'Saved database has no collection run'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('RUN_ID='+row[0]+'\n')
          PY
      - name: Audit saved detail evidence without new retailer requests
        run: python -m scripts.audit_saved_samples --run-id "$RUN_ID" > reports-sample-audit.json
      - name: Regenerate and reconcile reports
        run: |
          python -m music_deals.cli export --run-id "$RUN_ID"
          mv reports-sample-audit.json reports/sample_audit.json
          python scripts/validate_outputs.py | tee reports/output_validation.json
      - name: Summary
        if: always()
        run: |
          echo 'Reports regenerated from saved evidence. Collection timestamps and prices were not refreshed.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f reports/executive_summary.md ]]; then cat reports/executive_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-deals-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            data/deals.sqlite*
            data/evidence/
          retention-days: 30
          if-no-files-found: warn
